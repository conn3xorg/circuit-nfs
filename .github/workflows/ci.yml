name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      # The NFS server runs in the runner's kernel, inside the container.
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          sudo modprobe nfsd
          ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Two client containers on the host's network: 10.89.63.10 is on the
      # projects export's list and 10.89.63.11 isn't. The first mounts over
      # NFSv4.2 and writes a file, which shows on the server owned by
      # nobody, and fails to mount over NFSv3. The second can't mount
      # projects, and can mount public but not write to it.
      - name: Mount from clients and check access
        run: |
          for ip in 10 11; do
            sudo podman run -d --name circuit-nfs-client$ip --privileged --network circuit-nfs --ip 10.89.63.$ip --entrypoint sleep circuit-nfs infinity
            sudo podman exec circuit-nfs-client$ip sh -c 'if command -v apt-get >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nfs-common; else dnf -y -q install nfs-utils; fi; mkdir -p /mnt/projects /mnt/public'
          done
          sudo podman exec circuit-nfs-client10 sh -eu -c '
            mount -t nfs4 -o vers=4.2 10.89.63.2:/srv/nfs/projects /mnt/projects
            echo hello > /mnt/projects/from-client.txt
            umount /mnt/projects
            if mount -t nfs -o vers=3,nolock 10.89.63.2:/srv/nfs/projects /mnt/projects; then exit 1; fi'
          [ "$(sudo podman exec circuit-nfs cat /srv/nfs/projects/from-client.txt)" = hello ]
          [ "$(sudo podman exec circuit-nfs stat -c %U /srv/nfs/projects/from-client.txt)" = nobody ]
          sudo podman exec circuit-nfs grep -q -- '^-3 ' /proc/fs/nfsd/versions
          sudo podman exec circuit-nfs-client11 sh -eu -c '
            if mount -t nfs4 10.89.63.2:/srv/nfs/projects /mnt/projects; then exit 1; fi
            mount -t nfs4 10.89.63.2:/srv/nfs/public /mnt/public
            ls /mnt/public
            if touch /mnt/public/x; then exit 1; fi
            umount /mnt/public'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
